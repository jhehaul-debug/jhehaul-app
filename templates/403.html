{% extends "base.html" %}
{% block title %}Access Denied - JHE Haul{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:48px auto;text-align:center;padding:40px 32px;">
    <div style="font-size:3rem;margin-bottom:12px;">🚫</div>
    <h2 style="margin-bottom:8px;">Access Denied</h2>
    <p style="color:#718096;margin-bottom:28px;">
        You don't have permission to view that page.
    </p>
    {% if current_user.is_authenticated %}
        <a href="{{ url_for('marketplace') }}" class="btn btn-primary">Browse Marketplace</a>
    {% else %}
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Sign In</a>
    {% endif %}
</div>
{% endblock %}
